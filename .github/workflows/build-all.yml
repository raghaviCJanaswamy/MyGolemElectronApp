name: Build Electron (with vendored R)

on:
  push:
    branches: [ feature/electron ]
    paths:
      - "electron/**"
      - "shinygo/**"
      - "app/**"
      - "package.json"
      - ".github/workflows/*.yml"      
      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            node: 20
            r_version: "4.4.1"
            mac_arch: "arm64"
          - os: windows-latest
            node: 20
            r_version: "4.4.1"
            win_arch: "x64"

    runs-on: ${{ matrix.os }}

    # Run all commands inside the electron/ folder
    defaults:
      run:
        working-directory: electron

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # mac notarization (optional)
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}       
          cache: npm
          cache-dependency-path: electron/package-lock.json  # <-- lockfile location

      - name: Show tree (debug)
        shell: bash
        run: |
          pwd
          ls -la
          echo "Parent:"
          ls -la ..

      # runs inside electron/ per your defaults.run.working-directory
      - name: Install npm deps (prefer ci, fallback to install)
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f package-lock.json ]; then
            # try clean, else regenerate lock + install
            npm ci || (echo "npm ci failed — lockfile out of sync. Falling back to npm install…" \
              && rm -rf node_modules \
              && npm install --no-fund --no-audit)
          else
            npm install --no-fund --no-audit
          fi




      # --- Prepare portable R runtime on macOS ---
      - name: Prepare R runtime (macOS)
        if: ${{ startsWith(matrix.os, 'macos-') }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "resources/r-runtime/mac-${{ matrix.mac_arch }}"
          R_HOME="$(R RHOME)"
          FRAMEWORK_DIR="$(cd "${R_HOME}/.." && pwd -P)"
          rsync -a --delete "${FRAMEWORK_DIR}/" "resources/r-runtime/mac-${{ matrix.mac_arch }}/R.framework/"
          rm -rf "resources/r-runtime/mac-${{ matrix.mac_arch }}/R.framework/Resources/doc" || true
          rm -rf "resources/r-runtime/mac-${{ matrix.mac_arch }}/R.framework/Resources/library/translations" || true

      # --- Prepare portable R runtime on Windows ---

      # --- Prepare portable R runtime on Windows (no Chocolatey needed) ---

      # --- Prepare portable R runtime on Windows (no Chocolatey) ---
      - name: Prepare R runtime (Windows)
        if: ${{ startsWith(matrix.os, 'windows-') }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          # Resolve real executables (avoid PS alias 'r')
          $rExe    = (Get-Command R.exe -ErrorAction Stop).Source
          $rscript = (Get-Command Rscript.exe -ErrorAction Stop).Source

          # Query R home and version
          $rHome = (& $rExe RHOME).Trim()
          if (-not (Test-Path $rHome)) { throw "R RHOME path not found: $rHome" }

          $rVer = (& $rscript --vanilla -e "cat(getRversion())").Trim()
          if (-not $rVer) { $rVer = "${{ matrix.r_version }}" }  # fallback

          # Destination like resources\r-runtime\win-x64\R-<actual-version>
          $destRoot = "resources\r-runtime\win-${{ matrix.win_arch }}"
          $dest = Join-Path $destRoot ("R-" + $rVer)
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          Write-Host "R HOME: $rHome"
          Write-Host "R VER : $rVer"
          Write-Host "DEST  : $dest"

          # Copy R tree
          robocopy "$rHome" "$dest" /E /NFL /NDL /NJH /NJS /NC /NS
          $rc = $LASTEXITCODE
          Write-Host "Robocopy exit code: $rc"
          if ($rc -ge 8) { exit $rc } else { $global:LASTEXITCODE = 0 }  # normalize success

          # Optional: trim docs to save space
          if (Test-Path "$dest\doc") { Remove-Item -Recurse -Force "$dest\doc" }



      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r_version }}          

      - name: Build
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: electron/release/**/*    # note: path from repo root
